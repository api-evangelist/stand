name: STAND+
description: >-
  STAND+ is a Techstars-backed footwear company making biomechanically
  engineered "energy-recovery" shoes for people who spend long hours standing
  or walking - healthcare workers, frontline and workforce professionals,
  athletes, and everyday movers. Its proprietary midsole is designed to
  dissipate and disperse impact energy outward rather than returning it into
  the joints, which the company markets for fatigue and pain reduction. The
  product lineup includes the AntiGrav1, AntiGrav2, and AG3 recovery shoes, the
  Gales Pro and Gales Frontline workforce and healthcare lines, and standalone
  recovery insoles. STAND+ is APMA (American Podiatric Medical Association)
  certified and HSA/FSA eligible through a Truemed partnership. This is a
  direct-to-consumer e-commerce brand (standshoes.com) with no public developer
  API, SDK, or integration surface at the time of enrichment.
